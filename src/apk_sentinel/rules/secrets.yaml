# Secret-detection rules for apk-sentinel.
#
# Each rule is matched (re.search) against every string in the DEX string pool and against
# string resources (res/values/strings.xml). To add a rule, append an entry; no Python needed.
#
#   id              unique, stable identifier shown in reports (SECRET-...)
#   name            human title
#   pattern         Python regular expression
#   severity        info | low | medium | high | critical
#   confidence      high | medium | low   (how likely a match is a true positive)
#   masvs           MASVS v2 control ids
#   redact          true (default): never print the full match, only a masked preview
#   description / recommendation   shown in the report
version: 1
rules:
  - id: SECRET-AWS-ACCESS-KEY
    name: AWS access key ID
    pattern: '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'
    severity: high
    confidence: high
    masvs: [MASVS-CRYPTO-2, MASVS-STORAGE-2]
    description: >-
      An AWS access key ID is embedded in the app. Anyone can extract it from the APK, and
      paired with the secret key it grants access to the AWS account.
    recommendation: >-
      Revoke and rotate the key. Never ship long-lived cloud credentials; use short-lived
      tokens issued by your backend (e.g. Cognito / STS).

  - id: SECRET-PRIVATE-KEY
    name: Private key material
    pattern: '-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED |PGP )?PRIVATE KEY(?: BLOCK)?-----'
    severity: critical
    confidence: high
    masvs: [MASVS-CRYPTO-2]
    redact: false
    description: >-
      A PEM private key header was found in the app's strings. Private keys must never leave
      the server or the platform keystore.
    recommendation: >-
      Revoke the key pair, generate a new one, and keep private keys server-side or in the
      Android Keystore.

  - id: SECRET-GOOGLE-API-KEY
    name: Google API key
    pattern: '\bAIza[0-9A-Za-z_\-]{35}\b'
    severity: medium
    confidence: high
    masvs: [MASVS-STORAGE-2, MASVS-CRYPTO-2]
    description: >-
      A Google API key is embedded in the app. Such keys are often meant to be public
      (Maps, Firebase) but are abusable and billable if not restricted.
    recommendation: >-
      In Google Cloud Console restrict the key to your app's package name and SHA-1
      fingerprint and to only the APIs it needs.

  - id: SECRET-JWT
    name: JSON Web Token
    pattern: '\beyJ[A-Za-z0-9_\-]{8,}\.eyJ[A-Za-z0-9_\-]{8,}\.[A-Za-z0-9_\-]{8,}\b'
    severity: medium
    confidence: medium
    masvs: [MASVS-STORAGE-2, MASVS-AUTH-1]
    description: >-
      A hardcoded JWT is present. If it is a real, unexpired token it lets anyone act as
      its subject; even expired tokens leak claims.
    recommendation: >-
      Remove the token and issue tokens at login. Decode it to check for sensitive claims.

  - id: SECRET-GITHUB-TOKEN
    name: GitHub token
    pattern: '\b(?:gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{50,})\b'
    severity: high
    confidence: high
    masvs: [MASVS-CRYPTO-2, MASVS-STORAGE-2]
    description: A GitHub personal access or OAuth token is embedded in the app.
    recommendation: Revoke the token at github.com/settings/tokens and rotate it.

  - id: SECRET-SLACK-TOKEN
    name: Slack token
    pattern: '\bxox[abprs]-[0-9A-Za-z\-]{10,}\b'
    severity: high
    confidence: high
    masvs: [MASVS-CRYPTO-2, MASVS-STORAGE-2]
    description: A Slack API token is embedded in the app.
    recommendation: Revoke the token in the Slack app settings and rotate it.

  - id: SECRET-STRIPE-LIVE-KEY
    name: Stripe live secret key
    pattern: '\b(?:sk|rk)_live_[0-9A-Za-z]{24,}\b'
    severity: critical
    confidence: high
    masvs: [MASVS-CRYPTO-2, MASVS-STORAGE-2]
    description: >-
      A Stripe live secret key is embedded in the app. It can create charges and read
      customer data.
    recommendation: Roll the key in the Stripe dashboard immediately; keep it server-side.

  - id: SECRET-URL-CREDENTIALS
    name: Credentials embedded in a URL
    pattern: 'https?://[^/\s:@"]{1,64}:[^/\s:@"]{1,64}@[^/\s"]+'
    severity: high
    confidence: medium
    masvs: [MASVS-STORAGE-2, MASVS-AUTH-1]
    description: A URL contains a username and password (https://user:pass@host).
    recommendation: Remove the credentials; authenticate with tokens obtained at runtime.

  - id: SECRET-FIREBASE-DATABASE
    name: Firebase Realtime Database URL
    pattern: 'https://[a-z0-9\-]+(?:-default-rtdb)?\.(?:firebaseio\.com|firebasedatabase\.app)'
    severity: info
    confidence: high
    masvs: [MASVS-STORAGE-2]
    redact: false
    description: >-
      A Firebase Realtime Database endpoint is referenced. Misconfigured rules often expose
      the whole database to unauthenticated reads.
    recommendation: >-
      Verify the database security rules deny unauthenticated access (try
      <url>/.json in a browser, with permission to test).

  - id: SECRET-HARDCODED-CREDENTIAL
    name: Hardcoded credential assignment
    pattern: '(?i)\b(?:password|passwd|pwd|secret|api[_\-]?key|access[_\-]?token|auth[_\-]?token)\b\s*[:=]\s*["'']?[^\s"'']{8,}'
    severity: low
    confidence: low
    masvs: [MASVS-STORAGE-2, MASVS-CRYPTO-2]
    description: >-
      A string looks like `password=...` / `api_key: ...`. This heuristic has many false
      positives (log messages, JSON keys); review the evidence.
    recommendation: Remove hardcoded credentials; fetch secrets at runtime or via a backend.
