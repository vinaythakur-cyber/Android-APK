name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types, unit tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest --cov=apk_sentinel --cov-report=term-missing

  integration:
    name: Integration (real APK built from the fixture app)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: apktool-${{ hashFiles('scripts/build_fixture_apk.py') }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Build fixture APK (never committed)
        run: python scripts/build_fixture_apk.py
      - name: Run integration tests
        run: pytest -m integration
        env:
          APK_SENTINEL_SAMPLE_APK: samples/vulnapp.apk
      - name: Scan the fixture and keep the reports
        run: apk-sentinel scan samples/vulnapp.apk --out report/
      - uses: actions/upload-artifact@v4
        with:
          name: sample-report
          path: report/

  docker:
    name: Docker image builds and runs
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t apk-sentinel .
      - name: Smoke test
        run: docker run --rm apk-sentinel --version
