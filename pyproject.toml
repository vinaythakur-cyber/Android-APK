[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "apk-sentinel"
dynamic = ["version"]
description = "Static security analyzer for Android APKs with OWASP MASVS-mapped JSON and HTML reports."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Vinay Thakur" }]
keywords = ["android", "apk", "security", "static-analysis", "masvs", "owasp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "androguard>=4.1,<5",
    "typer>=0.12",
    "rich>=13",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
apk-sentinel = "apk_sentinel.cli:app"

[project.urls]
Homepage = "https://github.com/vinaythakur-cyber/Android"

[tool.hatch.version]
path = "src/apk_sentinel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/apk_sentinel"]

[tool.hatch.build.targets.sdist]
include = ["src/apk_sentinel", "tests", "docs", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a real APK (set APK_SENTINEL_SAMPLE_APK); skipped otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PT", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["androguard.*"]
ignore_missing_imports = true
